name: Daily Darshan Automated Scraper & AI Generator

on:
  schedule:
    # Runs at 02:30 UTC every day (= 08:00 AM IST Indian Standard Time)
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  update-daily-darshan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r daily_darshan/requirements.txt

      - name: Run Daily Darshan Fetcher
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FLUX_API_KEY: ${{ secrets.FLUX_API_KEY }}
        run: |
          python daily_darshan/main.py

      - name: Commit and Push Updated Darshan Images & Manifest
        run: |
          git config --global user.name 'Daily Darshan Bot'
          git config --global user.email 'bot@ziddifounder.com'
          git add daily_darshan/assets/daily/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Daily Darshan images & manifest [$(date +'%Y-%m-%d')]" && git push)
